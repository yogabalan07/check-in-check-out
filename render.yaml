# Render Blueprint — https://render.com/docs/blueprint-spec
# Deploys the backend as a Web Service and the frontend as a Static Site.
# Secrets are marked `sync: false` — you must enter them in the Render dashboard.

services:
  - type: web
    name: hackathon-attendance-api
    runtime: node
    rootDir: backend
    buildCommand: npm install && npm run build
    startCommand: npm run start:prod
    preDeployCommand: npm run seed
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: FRONTEND_URL
        value: https://check-in-check-out-nhav.onrender.com
      - key: CORS_ORIGINS
        value: http://localhost:5173,https://check-in-check-out-nhav.onrender.com
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: TIMEZONE
        value: Asia/Kolkata
      - key: HACKATHON_START_TIME
        value: "09:00"
      - key: HACKATHON_END_TIME
        value: "17:00"

  - type: web
    name: hackathon-attendance-web
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        value: https://check-in-out-s0r8.onrender.com/api
    routes:
      - type: rewrite
        source: /*
        destination: /index.html